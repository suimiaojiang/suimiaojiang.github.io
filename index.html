    <style>
        body {
            background-color: #000000;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        #top-image-container {
            text-align: center;
            margin: 1em 0;
        }
        #top-image {
            object-fit: cover;
            display: block;
            margin: 0 auto;
            width: auto;
            height: 9/16;
            border-radius: 10px;
        }
        @media (max-width: 767px) {
            #top-image {
                height: 22vh;
                width: calc(22vh * 2);
                border-radius: 10px;
            }
        }
        @media (min-width: 768px) and (max-width: 1023px) {
            #top-image {
                height: 22vh;
                width: calc(22vh * 2);
                border-radius: 10px;
            }
        }
        @media (min-width: 1024px) and (max-width: 1279px) {
            #top-image {
                height: 36vh;
                width: calc(36vh * 2.5);
                border-radius: 10px;
            }
        }
        .section {
            padding: 5px 20px;
        }
        p {
            text-indent: 2em;
            margin: 5px 0;
        }
        .media-row {
            display: flex;
            overflow-x: auto;
            padding: 5px 0;
            gap: 10px;
            cursor: grab;
        }
        .media-row img, .media-row .video-container {
            width: calc(100vw / 3.3 - 15px);
            aspect-ratio: 3 / 4;
            object-fit: cover;
            object-position: center center;
            border-radius: 5px;
            cursor: pointer;
        }
        @media (min-width: 768px) and (max-width: 1023px) {
            .media-row img, .media-row .video-container {
                width: calc(100vw / 4.3 - 15px);
                height: calc((100vw / 4.3 - 15px) * 4 / 3);
            }
        }
        @media (min-width: 1024px) and (max-width: 1279px) {
            .media-row img, .media-row .video-container {
                width: calc(100vw / 6.3 - 15px);
                height: calc((100vw / 6.3 - 15px) * 4 / 3);
            }
        }
        @media (min-width: 1280px) {
            .media-row img, .media-row .video-container {
                width: calc(100vw / 10 - 15px);
                height: calc((100vw / 10 - 15px) * 4 / 3);
            }
        }
        .video-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 5px;
        }
        .video-container video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 5px;
            display: none;
        }
        .fullscreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        .fullscreen img, .fullscreen video {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            border-radius: 5px;
        }
        .fullscreen.active {
            display: flex;
            animation: fadeIn 0.3s forwards;
        }
        .fullscreen.inactive {
            animation: fadeOut 0.3s forwards;
            display: flex;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }
        @keyframes fadeOut {
            from {opacity: 1;}
            to {opacity: 0;}
        }
    </style>
</head>

    <div class='section media-row hide-scrollbar'>
        <img src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEUIZFqB01-K5l1uFBiA3R8lsm9YFRu8AAC_iQAAt1aOFRfcCA0y9LfpDsE.jpg" alt="image1">

    <div id="fullscreen" class="fullscreen" onclick="closeFullscreen(event)">
        <img id="fullscreen-image" src="" alt="fullscreen">
        <video id="fullscreen-video" controls></video>
    </div>

    <script>
        let currentIndex = 0;
        let mediaItems = [];
        let isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints;

        // 获取图片的真实地址（优先 data-src，否则 src）
        function getImageSrc(imgElement) {
            return imgElement.getAttribute('data-src') || imgElement.src;
        }

        // 打开全屏
        function openFullscreen(src, isVideo = false, index = 0) {
            currentIndex = index;
            const fullscreen = document.getElementById('fullscreen');
            const img = document.getElementById('fullscreen-image');
            const video = document.getElementById('fullscreen-video');

            document.body.style.overflow = 'hidden';

            if (isVideo) {
                img.style.display = 'none';
                video.style.display = 'block';
                video.src = src;
                video.play();
            } else {
                video.style.display = 'none';
                img.style.display = 'block';
                img.src = src;
            }

            fullscreen.classList.remove('inactive');
            fullscreen.classList.add('active');
        }

        // 关闭全屏
        function closeFullscreen(event) {
            const fullscreen = document.getElementById('fullscreen');
            const img = document.getElementById('fullscreen-image');
            const video = document.getElementById('fullscreen-video');

            if (event.target !== fullscreen) return;

            fullscreen.classList.remove('active');
            fullscreen.classList.add('inactive');
            document.body.style.overflow = '';

            setTimeout(() => {
                fullscreen.classList.remove('inactive');
                img.src = '';
                video.pause();
                video.src = '';
            }, 300);
        }

        // 切换媒体（上一张 / 下一张）
        function switchMedia(step) {
            currentIndex += step;
            if (currentIndex < 0) currentIndex = mediaItems.length - 1;
            if (currentIndex >= mediaItems.length) currentIndex = 0;

            const currentItem = mediaItems[currentIndex];
            // 获取真实图片地址
            let mediaUrl = getImageSrc(currentItem);
            let isVideo = false;

            // 简单判断：如果地址包含 'page' 且原图是封面，则当作视频处理（可根据实际需要调整）
            if (mediaUrl.includes('page') && currentItem.tagName === 'IMG') {
                isVideo = true;
                mediaUrl = mediaUrl.replace('page', 'video').replace('.jpg', '.mp4');
            }

            openFullscreen(mediaUrl, isVideo, currentIndex);
        }

        // 滑动切换图片（移动端）
        function slideImage(direction) {
            const img = document.getElementById('fullscreen-image');
            if (!img) return;

            img.style.transition = 'transform 0.3s ease';
            img.style.transform = `translateX(${-direction * 100}%)`;

            setTimeout(() => {
                switchMedia(direction);
                img.style.transition = 'none';
                img.style.transform = `translateX(${direction * 100}%)`;
                setTimeout(() => {
                    img.style.transition = 'transform 0.3s ease';
                    img.style.transform = 'translateX(0)';
                }, 20);
            }, 150);
        }

        document.addEventListener("DOMContentLoaded", function() {
            // 懒加载（可选，不影响主功能）
            let lazyloadImages = document.querySelectorAll(".lazyload");
            let imageObserver = new IntersectionObserver(function(entries, observer) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        let image = entry.target;
                        image.src = image.dataset.src;
                        image.classList.remove("lazyload");
                        imageObserver.unobserve(image);
                    }
                });
            });
            lazyloadImages.forEach(function(image) {
                imageObserver.observe(image);
            });

            // 收集 .media-row 内的所有图片（以及视频容器，这里先只处理图片）
            mediaItems = Array.from(document.querySelectorAll('.media-row img'));

            // 为每个图片绑定点击事件
            mediaItems.forEach((item, idx) => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    let imgUrl = getImageSrc(item);
                    let isVideo = false;
                    // 如果图片地址包含 'page' 且需要转成视频（可根据实际规则调整）
                    if (imgUrl.includes('page') && imgUrl.endsWith('.jpg')) {
                        isVideo = true;
                        imgUrl = imgUrl.replace('page', 'video').replace('.jpg', '.mp4');
                    }
                    openFullscreen(imgUrl, isVideo, idx);
                });
            });

            // 键盘左右键支持
            document.addEventListener('keydown', (e) => {
                if (document.getElementById('fullscreen').classList.contains('active')) {
                    if (e.key === 'ArrowRight') switchMedia(1);
                    else if (e.key === 'ArrowLeft') switchMedia(-1);
                }
            });

            // 移动端滑动支持
            if (isTouchDevice) {
                let startX = null;
                const fullscreenDiv = document.getElementById('fullscreen');
                fullscreenDiv.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                });
                fullscreenDiv.addEventListener('touchmove', (e) => {
                    if (e.touches.length !== 1 || !startX) return;
                    const diffX = e.touches[0].clientX - startX;
                    if (Math.abs(diffX) > 60) {
                        slideImage(diffX > 0 ? -1 : 1);
                        startX = null;
                    }
                });
                fullscreenDiv.addEventListener('touchend', () => {
                    startX = null;
                });
            }
        });
    </script>
